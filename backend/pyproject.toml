[project]
name = "travel-agent"
version = "0.1.0"
description = "LangGraph travel agent that streams json-render UI specs over AG-UI"
authors = [
    { email = "tezendahaltd@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ag-ui-langgraph>=0.0.48",
    "fastapi>=0.165.0",
    "jsonschema>=4.26.0",
    "langchain-core>=1.8.4",
    "langchain-ollama>=1.2.0",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
